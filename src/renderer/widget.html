<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none';" />
  <title>Widget</title>
  <link rel="stylesheet" href="note.css" />
  <link rel="stylesheet" href="fields.css" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body class="widget">
  <header id="bar" class="bar">
    <div class="grip"><span id="title" class="title"></span></div>
    <div class="actions">
      <button id="btn-new" class="btn" title="New note or widget" aria-label="New note or widget">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
      </button>
      <button id="btn-color" class="btn" title="Colour" aria-label="Colour" aria-expanded="false">
        <span class="swatch" id="swatch"></span>
      </button>
      <button id="btn-pin" class="btn" title="Keep on top" aria-label="Keep on top" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l-.6 3.4 2.1 2.1H4.5l2.1-2.1L6 2Z"/><path d="M8 7.5V14"/></svg>
      </button>
      <button id="btn-settings" class="btn" title="Widget settings" aria-label="Widget settings" aria-pressed="false">
        <svg class="cog" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="btn-close" class="btn btn-close" title="Close (stays in All Notes)" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8"/></svg>
      </button>
    </div>
  </header>

  <div id="palette" class="palette" hidden></div>

  <main class="body">
    <article id="preview" class="preview markdown"></article>
    <section id="settings" class="widget-settings" hidden></section>
  </main>

  <button id="foot" class="widget-foot" title="Refresh now">
    <span class="dot"></span>
    <span class="text" id="foot-text">Loading…</span>
    <span class="src" id="foot-src"></span>
  </button>

  <script src="../vendor/markdown-it.min.js"></script>
  <script src="markdown.js"></script>
  <script src="fields.js"></script>
  <script src="titlebar.js"></script>
  <script src="widget.js"></script>
</body>
</html>
