name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Check and package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Confirm the Markdown parser was vendored
        shell: bash
        run: test -f src/vendor/markdown-it.min.js

      - name: Parse every source file
        run: npm run check

      - name: Test the formatting engine
        run: npm test

      # Packages the app without building an installer. Catches broken
      # electron-builder config and missing files long before a release tag.
      - name: Package (smoke test)
        run: npm run pack:dir

      - name: Confirm the executable exists
        shell: bash
        run: test -f "dist/win-unpacked/Sticky Notes.exe"
